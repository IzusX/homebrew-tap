name: Tap checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d
        id: homebrew
        with:
          stable: true
      - name: Check scripts and casks
        env:
          TAP_NAME: ${{ steps.homebrew.outputs.tap-name }}
        run: |
          bash -n Scripts/update-arkvello.sh
          if [[ -f Casks/arkvello.rb ]]; then
            brew style Casks/arkvello.rb
            brew audit --cask "$TAP_NAME/arkvello"
          fi
