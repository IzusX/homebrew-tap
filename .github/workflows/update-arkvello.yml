name: Update Arkvello

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-arkvello
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d
        id: homebrew
        with:
          stable: true
      - name: Download and verify the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/update-arkvello.sh
      - name: Check cask before publishing
        env:
          TAP_NAME: ${{ steps.homebrew.outputs.tap-name }}
        run: |
          brew style Casks/arkvello.rb
          brew audit --cask "$TAP_NAME/arkvello"
      - name: Commit cask update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain -- Casks/arkvello.rb)" ]]; then
            echo 'Arkvello is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/arkvello.rb
          git commit -m 'Update Arkvello cask from published release'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
